version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "mulkymalikuldhaher"
    labels:
      - "dependencies"

  - package-ecosystem: "cargo"
    directory: "/src-tauri/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "mulkymalikuldhaher"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "mulkymalikuldhaher"
    labels:
      - "dependencies"
      - "ci"
